name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifacts
        run: |
          make zip dmg
          ls SLEEPNOT-*.zip SLEEPNOT-*.dmg
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SLEEPNOT-*.zip
            SLEEPNOT-*.dmg
          generate_release_notes: true
