<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>SLEEPNOT - Spotlight demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1a1d29;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
    color: #fff; }
  .wallpaper { position: absolute; inset: 0 0 0 0;
    background: radial-gradient(1200px 700px at 70% 20%, #2b3352 0%, #1a1d29 60%, #101221 100%); }
  .menubar { position: absolute; top: 0; left: 0; right: 0; height: 48px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(20px);
    display: flex; align-items: center; padding: 0 24px; font-size: 24px; gap: 28px; }
  .menubar .left { font-weight: 700; }
  .menubar .spacer { flex: 1; }
  .mb-icon { width: 34px; height: 34px; display: grid; place-items: center; opacity: .95; }
  #sleepnotIcon { display: none; border-radius: 8px; padding: 2px; }
  #sleepnotIcon.show { display: grid; }
  #sleepnotIcon.on { background: rgba(255,255,255,.18); }
  .spotlight { position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
    width: 900px; background: rgba(30,30,34,.92); border-radius: 18px;
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 40px 120px rgba(0,0,0,.6);
    overflow: hidden; opacity: 0; }
  .spotlight.show { opacity: 1; }
  .spotlight .row { display: flex; align-items: center; gap: 16px; padding: 26px 30px; font-size: 34px; }
  .spotlight .query { color: #fff; min-height: 48px; }
  .caret { display: inline-block; width: 3px; height: 40px; background: #fff; vertical-align: -8px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .result { display: flex; align-items: center; gap: 18px; padding: 22px 30px;
    border-top: 1px solid rgba(255,255,255,.1); font-size: 30px; }
  .result .app { width: 56px; height: 56px; border-radius: 14px; background: #000;
    display: grid; place-items: center; border: 1px solid rgba(255,255,255,.2); }
  .result.active { background: rgba(10,132,255,.45); }
  .caption { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center;
    font-size: 40px; font-weight: 600; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .menu { position: absolute; top: 56px; right: 120px; width: 380px; background: rgba(28,28,30,.96);
    border-radius: 14px; border: 1px solid rgba(255,255,255,.14); font-size: 26px;
    padding: 10px; display: none; }
  .menu.show { display: block; }
  .menu div { padding: 12px 16px; border-radius: 8px; }
  .menu div.sel { background: rgba(10,132,255,.6); }
  .hint { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
    font-size: 22px; color: rgba(255,255,255,.6); }
  button.replay { position: absolute; bottom: 24px; right: 30px; font-size: 20px;
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3);
    background: transparent; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="menubar">
  <span class="left">Finder</span>
  <span class="spacer"></span>
  <span class="mb-icon">🔋</span>
  <span class="mb-icon">📶</span>
  <span class="mb-icon" id="sleepnotIcon" title="SLEEPNOT">
    <svg id="snSvg" width="28" height="28" viewBox="0 0 28 28">
      <circle id="snCircle" cx="14" cy="14" r="9" fill="none" stroke="#fff" stroke-width="3"/>
      <circle id="snDot" cx="14" cy="14" r="3" fill="#fff" opacity="0"/>
    </svg>
  </span>
</div>

<div class="spotlight" id="spotlight">
  <div class="row">🔍 <span class="query"><span id="typed"></span><span class="caret" id="caret"></span></span></div>
  <div class="result" id="result" style="display:none">
    <div class="app">
      <svg width="30" height="30" viewBox="0 0 28 28"><circle cx="14" cy="14" r="9" fill="none" stroke="#fff" stroke-width="3"/></svg>
    </div>
    <div><div>SLEEPNOT.app</div><div style="font-size:20px;color:rgba(255,255,255,.6)">Application</div></div>
  </div>
</div>

<div class="menu" id="menu">
  <div id="m0">Indefinitely</div>
  <div id="m1">5 minutes</div>
  <div id="m2">15 minutes</div>
  <div id="m3">30 minutes</div>
  <div id="m4">1 hour</div>
  <div id="m5" style="color:rgba(255,255,255,.5)">Quit</div>
</div>

<div class="caption" id="caption"></div>
<div class="hint">1920x1080 - screen-record this page, trim to 10-14s - autoplay, click Replay to re-run</div>
<button class="replay" onclick="run()">Replay</button>

<script>
const typed = document.getElementById('typed');
const spotlight = document.getElementById('spotlight');
const result = document.getElementById('result');
const caption = document.getElementById('caption');
const icon = document.getElementById('sleepnotIcon');
const menu = document.getElementById('menu');
const snCircle = document.getElementById('snCircle');
const snDot = document.getElementById('snDot');
const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  typed.textContent = ''; spotlight.classList.remove('show');
  result.style.display = 'none'; result.classList.remove('active');
  icon.classList.remove('show', 'on'); menu.classList.remove('show');
  snCircle.setAttribute('fill', 'none'); snDot.setAttribute('opacity', '0');
  document.querySelectorAll('.menu div').forEach(d => d.classList.remove('sel'));
  caption.textContent = 'Press Cmd+Space';
  await wait(800);
  spotlight.classList.add('show');
  await wait(400);
  caption.textContent = 'Type sleepnot';
  const word = 'sleepnot';
  for (const ch of word) { typed.textContent += ch; await wait(130); }
  await wait(300);
  result.style.display = 'flex';
  await wait(400);
  result.classList.add('active');
  caption.textContent = 'Open SLEEPNOT.app';
  await wait(900);
  spotlight.classList.remove('show');
  await wait(300);
  icon.classList.add('show');
  caption.textContent = 'Icon appears in the menu bar (OFF = hollow)';
  await wait(1400);
  icon.classList.add('on');
  snCircle.setAttribute('fill', '#fff');
  caption.textContent = 'Left-click: ON (filled). Mac stays awake.';
  await wait(1400);
  menu.classList.add('show');
  caption.textContent = 'Right-click: pick a duration';
  await wait(600);
  document.getElementById('m2').classList.add('sel');
  await wait(1200);
  caption.textContent = '15 minutes. Display can still sleep.';
  await wait(1600);
  caption.textContent = 'SLEEPNOT - Sleep is for humans.';
  await wait(2000);
}
run();
</script>
</body>
</html>
